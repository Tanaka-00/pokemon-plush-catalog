name: Refresh stock status

on:
  schedule:
    # Every 6 hours, off the top of the hour (fewer collisions with busy times).
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-stock
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch listing and rebuild catalog.json / stock.json
        run: python3 scripts/refresh.py

      - name: Commit and push if changed
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          if git diff --quiet stock.json catalog.json; then
            echo "No changes."
          else
            git add stock.json catalog.json
            git commit -m "Refresh stock status"
            git push
          fi
